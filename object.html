<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>user defined object</title>

</head>
<body>
    <script>
        let student = new Object();
        student.name="Sachin";
        student.id="1045";
        student.city="Etah";
        student.learning= function(){
            console.log("learning tech course");
         }
         console.log(student.name);
         student.learning();
         
    </script>
    
</body>
</html>
