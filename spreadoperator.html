<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head> 
<body>
    <script>
        let data = [10,20,30,40]
        function sum (...args)
        {
            let sum = 0
            for(let i of args)
            {
                sum = sum +i;

            }
            console.log(sum);

        }
        sum(10,20,30);
        sum(...data);
        console.log(data);
        console.log([...data]);
    </script>
</body>
