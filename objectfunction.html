<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Object</title>
</head>
<body>

    <script>
        let student = {
            name: "Sachin",
            id: 1045,
            city: "Etah",

            learning: function() {
                console.log("Tech Subject");
            }
        };

        console.log(student.name);
        console.log(student.id);
        console.log(student.city);

        student.learning();
    </script>

</body>
</html>
