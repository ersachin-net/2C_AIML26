<!DOCTYPE html>
<html>
<head>
    <title>Pattern</title>
    <script>
        function Display() {
            let num = parseInt(prompt("Enter a number"));

            // Increasing Pattern
            for(let i = 1; i <= num; i++) {
                for(let j = 1; j <= i; j++) {
                    document.write("*");
                }
                document.write("<br>");
            }

            // Decreasing Pattern
            for(let i = num - 1; i >= 1; i--) {
                for(let j = 1; j <= i; j++) {
                    document.write("*");
                }
                document.write("<br>");
            }
        }
    </script>
</head>

<body>

    <input type="button" value="Display" onclick="Display()">

</body>
</html>
