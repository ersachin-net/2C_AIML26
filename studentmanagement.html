<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Student {
    static count = 0;

    constructor(rollNo, name, marks) {
        this.rollNo = rollNo;
        this.name = name;
        this.marks = marks;

        Student.count++;
    }

    displayResult() {
        console.log("Roll No:", this.rollNo);
        console.log("Name:", this.name);
        console.log("Marks:", this.marks);

        if (this.marks >= 40) {
            console.log("Result: Pass");
        } else {
            console.log("Result: Fail");
        }

        console.log("----------------");
    }

    static displayCount() {
        console.log("Total Students:", Student.count);
    }
}

let s1 = new Student(1, "Sachin", 80);
let s2 = new Student(2, "Rahul", 35);
let s3 = new Student(3, "Aman", 65);

s1.displayResult();
s2.displayResult();
s3.displayResult();

Student.displayCount();
    </script>
    
</body>
</html>
